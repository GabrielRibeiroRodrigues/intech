services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intech-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

  nginx:
    image: nginx:1.27-alpine
    container_name: intech-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
